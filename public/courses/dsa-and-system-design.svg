<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-dsa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080816" />
      <stop offset="50%" stop-color="#12102e" />
      <stop offset="100%" stop-color="#09081a" />
    </linearGradient>
    <radialGradient id="glow-dsa" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-dsa" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#818cf8" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg-dsa)" />
  <rect width="800" height="450" fill="url(#grid-dsa)" />
  <circle cx="400" cy="225" r="270" fill="url(#glow-dsa)" />

  <g transform="translate(180, 75)">
    <rect x="-10" y="-10" width="460" height="320" rx="20" fill="#818cf8" fill-opacity="0.1" filter="blur(16px)" />
    <rect x="0" y="0" width="440" height="300" rx="16" fill="#12102e" fill-opacity="0.9" stroke="#818cf8" stroke-opacity="0.35" stroke-width="1.5" />
    
    <rect x="0" y="0" width="440" height="42" rx="16" fill="#0a081c" fill-opacity="0.95" />
    <path d="M 0 42 L 440 42" stroke="#818cf8" stroke-opacity="0.2" stroke-width="1" />
    <circle cx="24" cy="21" r="5" fill="#f43f5e" />
    <circle cx="42" cy="21" r="5" fill="#eab308" />
    <circle cx="60" cy="21" r="5" fill="#10b981" />
    <text x="220" y="26" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">AlgorithmSolver.cpp — O(log N) Time</text>

    <!-- Tree & System Design Visualization -->
    <g transform="translate(220, 130)">
      <!-- Root Node -->
      <circle cx="0" cy="-40" r="18" fill="#312e81" stroke="#818cf8" stroke-width="2" />
      <text x="0" y="-35" fill="#e0e7ff" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">50</text>

      <!-- Branches -->
      <line x1="-12" y1="-28" x2="-60" y2="10" stroke="#818cf8" stroke-width="2" />
      <line x1="12" y1="-28" x2="60" y2="10" stroke="#818cf8" stroke-width="2" />

      <!-- Left Child -->
      <circle cx="-60" cy="18" r="16" fill="#1e1b4b" stroke="#a5b4fc" stroke-width="1.5" />
      <text x="-60" y="22" fill="#c7d2fe" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">25</text>

      <!-- Right Child -->
      <circle cx="60" cy="18" r="16" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.5" />
      <text x="60" y="22" fill="#bae6fd" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">75</text>

      <!-- Sub Branches -->
      <line x1="-70" y1="30" x2="-100" y2="55" stroke="#a5b4fc" stroke-width="1.5" />
      <line x1="-50" y1="30" x2="-25" y2="55" stroke="#a5b4fc" stroke-width="1.5" />
      <line x1="50" y1="30" x2="25" y2="55" stroke="#38bdf8" stroke-width="1.5" />
      <line x1="70" y1="30" x2="100" y2="55" stroke="#38bdf8" stroke-width="1.5" />

      <!-- Leaves -->
      <circle cx="-100" cy="62" r="12" fill="#0f172a" stroke="#a5b4fc" stroke-width="1" />
      <text x="-100" y="65" fill="#cbd5e1" font-family="monospace" font-size="9" text-anchor="middle">10</text>

      <circle cx="-25" cy="62" r="12" fill="#0f172a" stroke="#a5b4fc" stroke-width="1" />
      <text x="-25" y="65" fill="#cbd5e1" font-family="monospace" font-size="9" text-anchor="middle">30</text>

      <circle cx="25" cy="62" r="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      <text x="25" y="65" fill="#cbd5e1" font-family="monospace" font-size="9" text-anchor="middle">60</text>

      <circle cx="100" cy="62" r="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      <text x="100" y="65" fill="#cbd5e1" font-family="monospace" font-size="9" text-anchor="middle">90</text>
    </g>

    <!-- Bottom Metric Banner -->
    <g transform="translate(30, 230)">
      <rect x="0" y="0" width="380" height="42" rx="8" fill="#0a081c" stroke="#818cf8" stroke-opacity="0.25" />
      <circle cx="20" cy="21" r="5" fill="#a855f7" />
      <text x="36" y="25" fill="#e0e7ff" font-family="monospace" font-size="11" font-weight="600">DYNAMIC PROGRAMMING, GRAPHS &amp; SYSTEM DESIGN</text>
    </g>
  </g>

  <g transform="translate(45, 195)">
    <circle cx="30" cy="30" r="32" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
    <text x="30" y="36" fill="#818cf8" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">O(N)</text>
  </g>
  <g transform="translate(695, 195)">
    <circle cx="30" cy="30" r="32" fill="#1e1b4b" stroke="#c084fc" stroke-width="1" />
    <text x="30" y="36" fill="#c084fc" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">DP</text>
  </g>
</svg>