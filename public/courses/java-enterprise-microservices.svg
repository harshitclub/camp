    <rect x="0" y="0" width="440" height="300" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="#f97316" stroke-opacity="0.35" stroke-width="1.5" />
    
    <rect x="0" y="0" width="440" height="42" rx="16" fill="#090d16" fill-opacity="0.95" />
    <path d="M 0 42 L 440 42" stroke="#f97316" stroke-opacity="0.2" stroke-width="1" />
    <circle cx="24" cy="21" r="5" fill="#f43f5e" />
    <circle cx="42" cy="21" r="5" fill="#eab308" />
    <circle cx="60" cy="21" r="5" fill="#10b981" />
    <text x="220" y="26" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">OrderService.java — Spring Boot 3</text>

    <!-- Code Block -->
    <text x="28" y="78" fill="#f97316" font-family="monospace" font-size="13" font-weight="600">@SpringBootApplication</text>
    <text x="28" y="104" fill="#38bdf8" font-family="monospace" font-size="13">public class</text>
    <text x="135" y="104" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="600">MicroserviceCloud</text>
    <text x="280" y="104" fill="#94a3b8" font-family="monospace" font-size="13">{</text>

    <!-- Microservice Nodes Graph -->
    <g transform="translate(30, 130)">
      <rect x="0" y="0" width="115" height="60" rx="10" fill="#1e293b" stroke="#f97316" stroke-width="1.2" />
      <text x="57" y="26" fill="#f97316" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">API GATEWAY</text>
      <text x="57" y="44" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">Spring Cloud</text>

      <path d="M 118 30 L 132 30" stroke="#f97316" stroke-width="2" stroke-dasharray="2 2" />

      <rect x="135" y="0" width="115" height="60" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      <text x="192" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">KAFKA CLUSTER</text>
      <text x="192" y="44" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">Event Stream</text>

      <path d="M 253 30 L 267 30" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2 2" />

      <rect x="270" y="0" width="110" height="60" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
      <text x="325" y="26" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">POSTGRES DB</text>
      <text x="325" y="44" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">JPA / Hibernate</text>
    </g>

    <!-- Footer Tag -->
    <g transform="translate(30, 230)">
      <rect x="0" y="0" width="380" height="42" rx="8" fill="#090d16" stroke="#f97316" stroke-opacity="0.25" />
