<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-mde" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050e18" />
      <stop offset="50%" stop-color="#0a1d30" />
      <stop offset="100%" stop-color="#061220" />
    </linearGradient>
    <radialGradient id="glow-mde" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-mde" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#06b6d4" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg-mde)" />
  <rect width="800" height="450" fill="url(#grid-mde)" />
  <circle cx="400" cy="225" r="270" fill="url(#glow-mde)" />

  <g transform="translate(180, 75)">
    <rect x="-10" y="-10" width="460" height="320" rx="20" fill="#06b6d4" fill-opacity="0.12" filter="blur(16px)" />
    <rect x="0" y="0" width="440" height="300" rx="16" fill="#0a1d30" fill-opacity="0.9" stroke="#06b6d4" stroke-opacity="0.35" stroke-width="1.5" />
    
    <rect x="0" y="0" width="440" height="42" rx="16" fill="#05101a" fill-opacity="0.95" />
    <path d="M 0 42 L 440 42" stroke="#06b6d4" stroke-opacity="0.2" stroke-width="1" />
    <circle cx="24" cy="21" r="5" fill="#f43f5e" />
    <circle cx="42" cy="21" r="5" fill="#eab308" />
    <circle cx="60" cy="21" r="5" fill="#10b981" />
    <text x="220" y="26" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">LakehousePipeline.py — Spark &amp; BigQuery</text>

    <!-- Pipeline Architecture -->
    <g transform="translate(30, 80)">
      <rect x="0" y="0" width="105" height="120" rx="10" fill="#082238" stroke="#06b6d4" stroke-width="1.2" />
      <text x="52" y="30" fill="#22d3ee" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">INGESTION</text>
      <text x="52" y="55" fill="#cbd5e1" font-family="monospace" font-size="9" text-anchor="middle">Kafka Streams</text>
      <text x="52" y="75" fill="#cbd5e1" font-family="monospace" font-size="9" text-anchor="middle">REST APIs</text>
      <text x="52" y="95" fill="#cbd5e1" font-family="monospace" font-size="9" text-anchor="middle">MongoDB CDC</text>

      <path d="M 108 60 L 132 60" stroke="#06b6d4" stroke-width="2" stroke-dasharray="2 2" />

      <rect x="135" y="0" width="110" height="120" rx="10" fill="#082238" stroke="#38bdf8" stroke-width="1.2" />
      <text x="190" y="30" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">PROCESSING</text>
      <text x="190" y="55" fill="#cbd5e1" font-family="monospace" font-size="9" text-anchor="middle">Apache Spark</text>
      <text x="190" y="75" fill="#cbd5e1" font-family="monospace" font-size="9" text-anchor="middle">Airflow DAGs</text>
      <text x="190" y="95" fill="#cbd5e1" font-family="monospace" font-size="9" text-anchor="middle">dbt Models</text>

      <path d="M 248 60 L 272 60" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2 2" />

      <rect x="275" y="0" width="105" height="120" rx="10" fill="#082238" stroke="#10b981" stroke-width="1.2" />
      <text x="327" y="30" fill="#34d399" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">WAREHOUSE</text>
      <text x="327" y="55" fill="#cbd5e1" font-family="monospace" font-size="9" text-anchor="middle">Snowflake</text>
      <text x="327" y="75" fill="#cbd5e1" font-family="monospace" font-size="9" text-anchor="middle">BigQuery</text>
      <text x="327" y="95" fill="#cbd5e1" font-family="monospace" font-size="9" text-anchor="middle">Iceberg Lake</text>
    </g>

    <g transform="translate(30, 230)">
      <rect x="0" y="0" width="380" height="42" rx="8" fill="#05101a" stroke="#06b6d4" stroke-opacity="0.3" />
      <circle cx="20" cy="21" r="5" fill="#06b6d4" />
      <text x="36" y="25" fill="#e0f2fe" font-family="monospace" font-size="11" font-weight="600">ETL PIPELINES, APACHE SPARK &amp; CLOUD WAREHOUSING</text>
    </g>
  </g>

  <g transform="translate(45, 195)">
    <circle cx="30" cy="30" r="32" fill="#164e63" stroke="#06b6d4" stroke-width="1" />
    <text x="30" y="37" fill="#67e8f9" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">ETL</text>
  </g>
  <g transform="translate(695, 195)">
    <circle cx="30" cy="30" r="32" fill="#164e63" stroke="#34d399" stroke-width="1" />
    <text x="30" y="37" fill="#6ee7b7" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">LAKE</text>
  </g>
</svg>