<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-uiux" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120514" />
      <stop offset="50%" stop-color="#240b28" />
      <stop offset="100%" stop-color="#140616" />
    </linearGradient>
    <radialGradient id="glow-uiux" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-uiux" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ec4899" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg-uiux)" />
  <rect width="800" height="450" fill="url(#grid-uiux)" />
  <circle cx="400" cy="225" r="270" fill="url(#glow-uiux)" />

  <g transform="translate(180, 75)">
