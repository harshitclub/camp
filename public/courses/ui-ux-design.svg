    <circle cx="60" cy="21" r="5" fill="#10b981" />
    <text x="220" y="26" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">DesignSystem.fig — Figma &amp; Design Systems</text>

