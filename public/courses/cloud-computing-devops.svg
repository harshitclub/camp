<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-devops" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c1c" />
      <stop offset="50%" stop-color="#0b1736" />
      <stop offset="100%" stop-color="#070e24" />
    </linearGradient>
    <radialGradient id="glow-devops" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-devops" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#38bdf8" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg-devops)" />
  <rect width="800" height="450" fill="url(#grid-devops)" />
  <circle cx="400" cy="225" r="270" fill="url(#glow-devops)" />

  <g transform="translate(180, 75)">
    <rect x="-10" y="-10" width="460" height="320" rx="20" fill="#38bdf8" fill-opacity="0.12" filter="blur(16px)" />
    <rect x="0" y="0" width="440" height="300" rx="16" fill="#0b1736" fill-opacity="0.9" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
    
    <rect x="0" y="0" width="440" height="42" rx="16" fill="#050a17" fill-opacity="0.95" />
    <path d="M 0 42 L 440 42" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1" />
    <circle cx="24" cy="21" r="5" fill="#f43f5e" />
    <circle cx="42" cy="21" r="5" fill="#eab308" />
    <circle cx="60" cy="21" r="5" fill="#10b981" />
    <text x="220" y="26" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">kubernetes-deployment.yaml — CI/CD Pipeline</text>

    <!-- DevOps Infinity & Container Cluster -->
    <g transform="translate(220, 130)">
      <!-- Left Loop -->
      <path d="M 0 0 C -40 -35 -90 -35 -90 0 C -90 35 -40 35 0 0 C 40 -35 90 -35 90 0 C 90 35 40 35 0 0 Z" fill="none" stroke="#38bdf8" stroke-width="3.5" />
      <path d="M 0 0 C -40 -35 -90 -35 -90 0 C -90 35 -40 35 0 0 C 40 -35 90 -35 90 0 C 90 35 40 35 0 0 Z" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="4 4" />
      
      <!-- Stage Tags -->
      <rect x="-105" y="-12" width="40" height="24" rx="6" fill="#0c234b" stroke="#38bdf8" stroke-width="1" />
      <text x="-85" y="4" fill="#38bdf8" font-family="system-ui" font-size="8" font-weight="700" text-anchor="middle">CODE</text>

      <rect x="65" y="-12" width="40" height="24" rx="6" fill="#0c234b" stroke="#818cf8" stroke-width="1" />
      <text x="85" y="4" fill="#818cf8" font-family="system-ui" font-size="8" font-weight="700" text-anchor="middle">DEPLOY</text>

      <circle cx="0" cy="0" r="7" fill="#10b981" />
    </g>

    <g transform="translate(30, 230)">
      <rect x="0" y="0" width="380" height="42" rx="8" fill="#050a17" stroke="#38bdf8" stroke-opacity="0.3" />
      <circle cx="20" cy="21" r="5" fill="#38bdf8" />
      <text x="36" y="25" fill="#f0f9ff" font-family="monospace" font-size="11" font-weight="600">DOCKER, KUBERNETES, TERRAFORM &amp; GITHUB ACTIONS</text>
    </g>
  </g>

  <g transform="translate(45, 195)">
    <circle cx="30" cy="30" r="32" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1" />
    <path d="M 20 30 L 26 24 L 34 24 L 40 30 L 34 36 L 26 36 Z" fill="none" stroke="#38bdf8" stroke-width="2" />
  </g>
  <g transform="translate(695, 195)">
    <circle cx="30" cy="30" r="32" fill="#0c4a6e" stroke="#818cf8" stroke-width="1" />
    <text x="30" y="37" fill="#a5b4fc" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">K8s</text>
  </g>
</svg>