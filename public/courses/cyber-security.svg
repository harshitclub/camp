<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-sec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0505" />
      <stop offset="50%" stop-color="#1f0909" />
      <stop offset="100%" stop-color="#140606" />
    </linearGradient>
    <radialGradient id="glow-sec" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-sec" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ef4444" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg-sec)" />
  <rect width="800" height="450" fill="url(#grid-sec)" />
  <circle cx="400" cy="225" r="270" fill="url(#glow-sec)" />

  <g transform="translate(180, 75)">
    <rect x="-10" y="-10" width="460" height="320" rx="20" fill="#ef4444" fill-opacity="0.12" filter="blur(16px)" />
    <rect x="0" y="0" width="440" height="300" rx="16" fill="#1f0909" fill-opacity="0.9" stroke="#ef4444" stroke-opacity="0.35" stroke-width="1.5" />
    
    <rect x="0" y="0" width="440" height="42" rx="16" fill="#0f0404" fill-opacity="0.95" />
    <path d="M 0 42 L 440 42" stroke="#ef4444" stroke-opacity="0.2" stroke-width="1" />
    <circle cx="24" cy="21" r="5" fill="#f43f5e" />
    <circle cx="42" cy="21" r="5" fill="#eab308" />
    <circle cx="60" cy="21" r="5" fill="#10b981" />
    <text x="220" y="26" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">FirewallAudit.sh — Network &amp; Pentest</text>

    <!-- Cyber Shield & Cryptographic Lock Graphic -->
    <g transform="translate(220, 130)">
      <path d="M 0 -45 L 45 -25 L 45 15 C 45 45 0 65 0 65 C 0 65 -45 45 -45 15 L -45 -25 Z" fill="#3b0a0a" stroke="#ef4444" stroke-width="2.5" />
      
      <!-- Lock Keyhole -->
      <circle cx="0" cy="5" r="10" fill="#fca5a5" />
      <path d="M -4 10 L 4 10 L 6 22 L -6 22 Z" fill="#fca5a5" />

      <!-- Surrounding Security Nodes -->
      <circle cx="-85" cy="0" r="15" fill="#180404" stroke="#10b981" stroke-width="1.2" />
      <text x="-85" y="4" fill="#6ee7b7" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">SOC</text>

      <circle cx="85" cy="0" r="15" fill="#180404" stroke="#38bdf8" stroke-width="1.2" />
      <text x="85" y="4" fill="#7dd3fc" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">WAF</text>
    </g>

    <g transform="translate(30, 230)">
      <rect x="0" y="0" width="380" height="42" rx="8" fill="#0f0404" stroke="#ef4444" stroke-opacity="0.3" />
      <circle cx="20" cy="21" r="5" fill="#ef4444" />
      <text x="36" y="25" fill="#fee2e2" font-family="monospace" font-size="11" font-weight="600">ETHICAL HACKING, OWASP TOP 10 &amp; NETWORK DEFENSE</text>
    </g>
  </g>

  <g transform="translate(45, 195)">
    <circle cx="30" cy="30" r="32" fill="#450a0a" stroke="#ef4444" stroke-width="1" />
    <path d="M 23 30 L 37 30 M 30 23 L 30 37" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" />
  </g>
  <g transform="translate(695, 195)">
    <circle cx="30" cy="30" r="32" fill="#450a0a" stroke="#10b981" stroke-width="1" />
    <path d="M 22 30 L 28 36 L 38 24" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>