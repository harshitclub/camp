    <rect x="0" y="0" width="440" height="300" rx="16" fill="#240b28" fill-opacity="0.9" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1.5" />
    
    <rect x="0" y="0" width="440" height="42" rx="16" fill="#120514" fill-opacity="0.95" />
    <path d="M 0 42 L 440 42" stroke="#ec4899" stroke-opacity="0.2" stroke-width="1" />
    <circle cx="24" cy="21" r="5" fill="#f43f5e" />
