<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-mkt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140707" />
      <stop offset="50%" stop-color="#260e0e" />
      <stop offset="100%" stop-color="#170808" />
    </linearGradient>
    <radialGradient id="glow-mkt" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-mkt" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#f43f5e" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg-mkt)" />
  <rect width="800" height="450" fill="url(#grid-mkt)" />
  <circle cx="400" cy="225" r="270" fill="url(#glow-mkt)" />

  <g transform="translate(180, 75)">
    <rect x="-10" y="-10" width="460" height="320" rx="20" fill="#f43f5e" fill-opacity="0.12" filter="blur(16px)" />
    <rect x="0" y="0" width="440" height="300" rx="16" fill="#260e0e" fill-opacity="0.9" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1.5" />
    
    <rect x="0" y="0" width="440" height="42" rx="16" fill="#140707" fill-opacity="0.95" />
    <path d="M 0 42 L 440 42" stroke="#f43f5e" stroke-opacity="0.2" stroke-width="1" />
    <circle cx="24" cy="21" r="5" fill="#f43f5e" />
    <circle cx="42" cy="21" r="5" fill="#eab308" />
    <circle cx="60" cy="21" r="5" fill="#10b981" />
    <text x="220" y="26" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">GrowthCampaign.ai — Performance Marketing</text>

    <!-- Marketing Funnel & Growth Curve Visual -->
    <g transform="translate(30, 65)">
      <!-- Metric Boxes -->
      <rect x="0" y="0" width="115" height="60" rx="8" fill="#170808" stroke="#f43f5e" stroke-width="1" />
      <text x="57" y="20" fill="#fb7185" font-family="system-ui" font-size="10" font-weight="700" text-anchor="middle">ROAS</text>
      <text x="57" y="44" fill="#ffffff" font-family="monospace" font-size="16" font-weight="800" text-anchor="middle">5.8x</text>

      <rect x="132" y="0" width="115" height="60" rx="8" fill="#170808" stroke="#fbbf24" stroke-width="1" />
      <text x="189" y="20" fill="#fde047" font-family="system-ui" font-size="10" font-weight="700" text-anchor="middle">CTR (ADS)</text>
      <text x="189" y="44" fill="#ffffff" font-family="monospace" font-size="16" font-weight="800" text-anchor="middle">4.32%</text>

      <rect x="265" y="0" width="115" height="60" rx="8" fill="#170808" stroke="#10b981" stroke-width="1" />
      <text x="322" y="20" fill="#6ee7b7" font-family="system-ui" font-size="10" font-weight="700" text-anchor="middle">CONVERSIONS</text>
      <text x="322" y="44" fill="#ffffff" font-family="monospace" font-size="16" font-weight="800" text-anchor="middle">24.8K</text>
    </g>

    <!-- Growth Graph -->
    <g transform="translate(30, 140)">
      <rect x="0" y="0" width="380" height="75" rx="8" fill="#140707" />
      <path d="M 20 60 C 80 55, 140 45, 200 35 C 260 25, 310 10, 360 5" fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" />
      <path d="M 20 60 C 80 55, 140 45, 200 35 C 260 25, 310 10, 360 5 L 360 68 L 20 68 Z" fill="#f43f5e" fill-opacity="0.15" />
      <circle cx="360" cy="5" r="4" fill="#f43f5e" />
    </g>

    <g transform="translate(30, 230)">
      <rect x="0" y="0" width="380" height="42" rx="8" fill="#140707" stroke="#f43f5e" stroke-opacity="0.3" />
      <circle cx="20" cy="21" r="5" fill="#f43f5e" />
      <text x="36" y="25" fill="#ffe4e6" font-family="monospace" font-size="11" font-weight="600">AI ADS, SEO OPTIMIZATION, PERFORMANCE &amp; FUNNELS</text>
    </g>
  </g>

  <g transform="translate(45, 195)">
    <circle cx="30" cy="30" r="32" fill="#4c0519" stroke="#f43f5e" stroke-width="1" />
    <path d="M 20 38 L 30 20 L 40 38 Z" fill="none" stroke="#f43f5e" stroke-width="2" />
  </g>
  <g transform="translate(695, 195)">
    <circle cx="30" cy="30" r="32" fill="#4c0519" stroke="#fbbf24" stroke-width="1" />
    <text x="30" y="37" fill="#fde047" font-family="system-ui" font-size="12" font-weight="800" text-anchor="middle">ROI</text>
  </g>
</svg>