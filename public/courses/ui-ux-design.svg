    <g transform="translate(60, 65)">
      <!-- Mobile Mockup Frame -->
      <rect x="0" y="0" width="120" height="150" rx="12" fill="#120514" stroke="#ec4899" stroke-width="1.5" />
      <rect x="15" y="15" width="90" height="18" rx="4" fill="#db2777" fill-opacity="0.4" />
      <rect x="15" y="42" width="40" height="40" rx="6" fill="#831843" />
      <rect x="65" y="42" width="40" height="40" rx="6" fill="#831843" />
      <rect x="15" y="92" width="90" height="35" rx="6" fill="#ec4899" fill-opacity="0.6" />
      <text x="60" y="114" fill="#ffffff" font-family="system-ui" font-size="9" font-weight="700" text-anchor="middle">CTA BUTTON</text>

      <!-- Palette Swatches & Typography Specs -->
      <g transform="translate(150, 15)">
        <circle cx="15" cy="15" r="14" fill="#ec4899" />
        <circle cx="55" cy="15" r="14" fill="#8b5cf6" />
        <circle cx="95" cy="15" r="14" fill="#06b6d4" />
        <circle cx="135" cy="15" r="14" fill="#10b981" />

        <text x="0" y="60" fill="#fbcfe8" font-family="system-ui" font-size="12" font-weight="700">Design Tokens &amp; Components</text>
        <text x="0" y="80" fill="#cbd5e1" font-family="monospace" font-size="10">Auto-Layout 5.0 • Variables</text>
        <text x="0" y="100" fill="#cbd5e1" font-family="monospace" font-size="10">Micro-Interactions • Heuristics</text>
      </g>
