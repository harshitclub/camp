<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0718" />
      <stop offset="50%" stop-color="#180d2b" />
      <stop offset="100%" stop-color="#0d071d" />
    </linearGradient>
    <linearGradient id="ai-glow-line" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <radialGradient id="glow-ai" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-ai" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#c084fc" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg-ai)" />
  <rect width="800" height="450" fill="url(#grid-ai)" />
  <circle cx="400" cy="225" r="270" fill="url(#glow-ai)" />

  <g transform="translate(180, 75)">
    <rect x="-10" y="-10" width="460" height="320" rx="20" fill="#a855f7" fill-opacity="0.12" filter="blur(16px)" />
    <rect x="0" y="0" width="440" height="300" rx="16" fill="#180d2b" fill-opacity="0.9" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.5" />
    
    <rect x="0" y="0" width="440" height="42" rx="16" fill="#0d071c" fill-opacity="0.95" />
    <path d="M 0 42 L 440 42" stroke="#a855f7" stroke-opacity="0.2" stroke-width="1" />
    <circle cx="24" cy="21" r="5" fill="#f43f5e" />
    <circle cx="42" cy="21" r="5" fill="#eab308" />
    <circle cx="60" cy="21" r="5" fill="#10b981" />
    <text x="220" y="26" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">AgentWorkflow.py — LangChain &amp; RAG</text>

    <!-- AI Synapse Core Graphic -->
    <g transform="translate(220, 135)">
      <circle cx="0" cy="0" r="32" fill="#3b0764" stroke="#c084fc" stroke-width="2" />
      <path d="M -10 -10 L 0 -20 L 10 -10 L 20 0 L 10 10 L 0 20 L -10 10 L -20 0 Z" fill="#c084fc" fill-opacity="0.3" stroke="#e9d5ff" stroke-width="1.5" />
      <circle cx="0" cy="0" r="8" fill="#f3e8ff" />

      <!-- Synapse Orbital Nodes -->
      <line x1="-24" y1="-24" x2="-80" y2="-40" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3 3" />
      <circle cx="-80" cy="-40" r="14" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.5" />
      <text x="-80" y="-36" fill="#38bdf8" font-family="system-ui" font-size="9" font-weight="700" text-anchor="middle">RAG</text>

      <line x1="24" y1="-24" x2="80" y2="-40" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3 3" />
      <circle cx="80" cy="-40" r="14" fill="#1e1b4b" stroke="#e879f9" stroke-width="1.5" />
      <text x="80" y="-36" fill="#e879f9" font-family="system-ui" font-size="9" font-weight="700" text-anchor="middle">LLM</text>

      <line x1="-24" y1="24" x2="-80" y2="40" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3 3" />
      <circle cx="-80" cy="40" r="14" fill="#1e1b4b" stroke="#34d399" stroke-width="1.5" />
      <text x="-80" y="44" fill="#34d399" font-family="system-ui" font-size="9" font-weight="700" text-anchor="middle">VEC</text>

      <line x1="24" y1="24" x2="80" y2="40" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3 3" />
      <circle cx="80" cy="40" r="14" fill="#1e1b4b" stroke="#f472b6" stroke-width="1.5" />
      <text x="80" y="44" fill="#f472b6" font-family="system-ui" font-size="9" font-weight="700" text-anchor="middle">AGENT</text>
    </g>

    <!-- Bottom Status -->
    <g transform="translate(30, 230)">
      <rect x="0" y="0" width="380" height="42" rx="8" fill="#0d071c" stroke="#a855f7" stroke-opacity="0.3" />
      <circle cx="20" cy="21" r="5" fill="#c084fc" />
      <text x="36" y="25" fill="#f3e8ff" font-family="monospace" font-size="11" font-weight="600">AUTONOMOUS AGENTS &amp; EMBEDDING RETRIEVAL</text>
    </g>
  </g>

  <g transform="translate(45, 195)">
    <circle cx="30" cy="30" r="32" fill="#2e1065" stroke="#c084fc" stroke-width="1" />
    <text x="30" y="38" fill="#e9d5ff" font-family="system-ui" font-size="20" text-anchor="middle">✦</text>
  </g>
  <g transform="translate(695, 195)">
    <circle cx="30" cy="30" r="32" fill="#2e1065" stroke="#38bdf8" stroke-width="1" />
    <text x="30" y="37" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">AI</text>
  </g>
</svg>