<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050c1a" />
      <stop offset="50%" stop-color="#0b172e" />
      <stop offset="100%" stop-color="#071124" />
    </linearGradient>
    <linearGradient id="cyan-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="glow-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="center-glow-1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-1" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#38bdf8" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#bg-grad-1)" />
  <rect width="800" height="450" fill="url(#grid-1)" />
  <circle cx="400" cy="225" r="280" fill="url(#center-glow-1)" />

  <!-- Abstract Code Terminal Window (Glassmorphic) -->
  <g transform="translate(180, 75)">
    <!-- Glow behind card -->
    <rect x="-10" y="-10" width="460" height="320" rx="20" fill="url(#glow-grad-1)" filter="blur(15px)" opacity="0.6" />
    
    <!-- Outer Card Frame -->
    <rect x="0" y="0" width="440" height="300" rx="16" fill="#0c1830" fill-opacity="0.85" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />
    
    <!-- Terminal Header Bar -->
    <rect x="0" y="0" width="440" height="42" rx="16" fill="#081020" fill-opacity="0.95" />
    <path d="M 0 42 L 440 42" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1" />
    <circle cx="24" cy="21" r="5" fill="#f43f5e" />
    <circle cx="42" cy="21" r="5" fill="#eab308" />
    <circle cx="60" cy="21" r="5" fill="#10b981" />
    <text x="220" y="26" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.05em">AppRouter.tsx — Full Stack SDE</text>

    <!-- Code & Architecture Graphics Inside Terminal -->
    <!-- Line 1: import statement -->
    <text x="28" y="76" fill="#f43f5e" font-family="monospace" font-size="13" font-weight="600">import</text>
    <text x="80" y="76" fill="#e2e8f0" font-family="monospace" font-size="13">{ NextApp, NodeAPI, DB }</text>
    <text x="282" y="76" fill="#f43f5e" font-family="monospace" font-size="13" font-weight="600">from</text>
    <text x="324" y="76" fill="#38bdf8" font-family="monospace" font-size="13">&apos;@fullstack/core&apos;</text>

    <!-- Line 2: async function -->
    <text x="28" y="106" fill="#818cf8" font-family="monospace" font-size="13" font-weight="600">export async function</text>
    <text x="195" y="106" fill="#38bdf8" font-family="monospace" font-size="13">DeployService</text>
    <text x="300" y="106" fill="#cbd5e1" font-family="monospace" font-size="13">() {</text>

    <!-- Line 3: await query -->
    <text x="48" y="136" fill="#94a3b8" font-family="monospace" font-size="12">// PostgreSQL, Redis Cache &amp; REST APIs</text>

    <!-- Visual Layer Nodes Inside Card -->
    <g transform="translate(30, 160)">
      <!-- Frontend Node -->
      <rect x="0" y="0" width="115" height="52" rx="10" fill="#0f2244" stroke="#38bdf8" stroke-width="1.2" />
      <text x="57" y="24" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">FRONTEND</text>
      <text x="57" y="40" fill="#cbd5e1" font-family="monospace" font-size="9" text-anchor="middle">Next.js 16 + React</text>

      <!-- Connecting Arrow 1 -->
      <path d="M 118 26 L 132 26" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2 2" />

      <!-- Backend Node -->
      <rect x="135" y="0" width="115" height="52" rx="10" fill="#141a4a" stroke="#818cf8" stroke-width="1.2" />
      <text x="192" y="24" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">BACKEND</text>
      <text x="192" y="40" fill="#cbd5e1" font-family="monospace" font-size="9" text-anchor="middle">Node.js + Express</text>

      <!-- Connecting Arrow 2 -->
      <path d="M 253 26 L 267 26" stroke="#818cf8" stroke-width="2" stroke-dasharray="2 2" />

      <!-- Database Node -->
      <rect x="270" y="0" width="110" height="52" rx="10" fill="#1e1b4b" stroke="#c084fc" stroke-width="1.2" />
      <text x="325" y="24" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">DATABASE</text>
      <text x="325" y="40" fill="#cbd5e1" font-family="monospace" font-size="9" text-anchor="middle">PostgreSQL + Redis</text>
    </g>

    <!-- Bottom Status Bar -->
    <g transform="translate(30, 235)">
      <rect x="0" y="0" width="380" height="42" rx="8" fill="#081020" fill-opacity="0.9" stroke="#38bdf8" stroke-opacity="0.2" />
      <circle cx="20" cy="21" r="5" fill="#10b981" />
      <text x="36" y="25" fill="#10b981" font-family="monospace" font-size="11" font-weight="600">SYSTEM STATUS: PRODUCTION READY</text>
      <text x="360" y="25" fill="#64748b" font-family="monospace" font-size="10" text-anchor="end">90-DAY TRACK</text>
    </g>
  </g>

  <!-- Left / Right Accent Badges -->
  <g transform="translate(40, 190)">
    <circle cx="35" cy="35" r="35" fill="#0c1a35" stroke="#38bdf8" stroke-width="1" />
    <path d="M 23 27 L 15 35 L 23 43 M 47 27 L 55 35 L 47 43 M 38 23 L 32 47" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <g transform="translate(685, 190)">
    <circle cx="35" cy="35" r="35" fill="#14193d" stroke="#818cf8" stroke-width="1" />
    <circle cx="35" cy="35" r="7" fill="#818cf8" />
    <ellipse cx="35" cy="35" rx="22" ry="9" fill="none" stroke="#818cf8" stroke-width="1.8" transform="rotate(30 35 35)" />
    <ellipse cx="35" cy="35" rx="22" ry="9" fill="none" stroke="#818cf8" stroke-width="1.8" transform="rotate(-30 35 35)" />
  </g>
</svg>
