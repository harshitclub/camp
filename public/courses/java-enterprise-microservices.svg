  <!-- Side Tech Badges -->
  <g transform="translate(45, 195)">
    <circle cx="30" cy="30" r="32" fill="#1e293b" stroke="#f97316" stroke-width="1" />
    <path d="M 20 38 C 20 22, 40 22, 40 38 Z" fill="none" stroke="#f97316" stroke-width="2" />
    <path d="M 25 18 Q 28 24 30 18 Q 32 24 35 18" fill="none" stroke="#f97316" stroke-width="1.5" stroke-linecap="round" />
